# Production override for a VPS (Hostinger KVM, Hetzner, DigitalOcean…) with automatic HTTPS via Caddy.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires in .env:  DOMAIN=carwash.example.com   (DNS A record must already point to the server)
services:
  app:
    ports: []                      # not exposed directly; Caddy fronts it
    expose: ["4000"]
    environment:
      CORS_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
